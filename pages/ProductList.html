<!DOCTYPE html>
<html lang="zh_Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品一覽 Products｜果東小舖 GUODONG</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <!-- 折扣區塊 -->
    <div class="discount">
      <p>新註冊會員：首單現折<span>NT$ 60</span></p>
    </div>
    <main class="pt-48">
      <div class="container">
        <!-- 麵包屑導覽 -->
        <div class="mb-24">
          <ol class="display-flex">
            <!-- 這邊有個homeIcon晚點處理 -->
            <li class="breadcrumb-item">
              <a href="./index.html" class="breadcrumb-link">首頁</a>
            </li>
            <li class="breadcrumb-item">商品一覽</li>
          </ol>
        </div>
        <!-- 標題區塊 -->
        <div class="productListTitle mb-24">
          <img src="../assets/image/Logo/img-Bow.svg" alt="Bow" class="mb-8" />
          <h1 class="h1 mb-8">商品一覽</h1>
          <p>果東提供各式禮品</p>
        </div>
        <!-- banner -->
        <img
          src="../assets/image/banner-pc.png"
          alt="banner"
          class="banner mb-24"
        />
        <!-- 篩選條件＆下拉選單 -->
        <div class="display-flex align-center mb-24">
          <p class="body-md pr-12">篩選條件：</p>
          <!-- Example single danger button -->
          <div class="btn-group">
            <button
              type="button"
              class="btn btn-danger dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              商品類別
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">全部</a></li>
              <li><a class="dropdown-item" href="#">香氛蠟燭</a></li>
              <li><a class="dropdown-item" href="#">音箱／音樂盒</a></li>
              <li><a class="dropdown-item" href="#">小夜燈</a></li>
              <li><a class="dropdown-item" href="#">文具</a></li>
              <li><a class="dropdown-item" href="#">日用品</a></li>
              <li><a class="dropdown-item" href="#">美容</a></li>
            </ul>
          </div>
        </div>
      </div>
    </main>
    <%- include('./layout/footer'); -%>
    <script type="module" src="../main.js"></script>
  </body>
</html>
